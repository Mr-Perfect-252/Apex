name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify signature and print SHAs
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK: $APK"

          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "---- Signer certificate (from the APK) ----"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" || true

          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          CERT_SHA=$(keytool -list -v -keystore keystore/apex-sample.keystore \
                      -storepass apexhub -storetype PKCS12 -alias apex-sample \
                      | grep -i "SHA256:" | sed 's/.*SHA256: //')

          {
            echo "## Build outputs"
            echo ""
            echo "### APK"
            echo "- Artifact: \`apex-sample-debug\`"
            echo "- Size: $(stat -c%s "$APK") bytes"
            echo ""
            echo "### APK SHA-256  _(ApexHub upload / SDK download verification)_"
            echo '```'
            echo "$APK_SHA"
            echo '```'
            echo "### Signing certificate SHA-256  _(ApexHub certificate pinning)_"
            echo '```'
            echo "$CERT_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-sample-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
